
name: Terraform Security Gate

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'gate/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - 'eval/baseline.json'

  pull_request:
    branches:
      - main

  workflow_dispatch:

# ==========================================================
# MINIMUM REQUIRED PERMISSIONS
# ==========================================================

permissions:
  contents: read

# ==========================================================
# CANCEL OUTDATED RUNS
# ==========================================================

concurrency:
  group: terraform-security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==========================================================
# JOBS
# ==========================================================

jobs:

  # --------------------------------------------------------
  # JOB 1: PYTHON AUTOMATED TESTS
  # --------------------------------------------------------

  python-tests:

    name: Python Security Tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run complete test suite
        run: python -m pytest tests/ -v


  # --------------------------------------------------------
  # JOB 2: TERRAFORM FORMATTING AND VALIDATION
  # --------------------------------------------------------

  terraform-validation:

    name: Terraform Validation

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Display Terraform version
        run: terraform version

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infra validate -no-color


  # --------------------------------------------------------
  # JOB 3: CHECKOV SECURITY SCAN
  # --------------------------------------------------------

  checkov-scan:

    name: Checkov Infrastructure Scan

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.12"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov==3.4.0

      - name: Prepare report directory
        run: mkdir -p eval/reports

      - name: Run Checkov security scan
        run: |
          checkov \
            -d infra \
            --framework terraform \
            -o cli \
            -o json \
            --output-file-path console,eval/reports/checkov-ci.json \
            --soft-fail

      - name: Select trusted security baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Using baseline from target branch."
            git show "${PR_BASE_SHA}:eval/baseline.json" > eval/reports/trusted-baseline.json
          else
            echo "Using baseline from checked-out commit."
            cp eval/baseline.json eval/reports/trusted-baseline.json
          fi

      - name: Enforce approved Checkov baseline
        run: |
          python -m gate.baseline_gate \
            --baseline eval/reports/trusted-baseline.json \
            --current eval/reports/checkov-ci.json \
            --output eval/reports/baseline-gate.json

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkov-security-report
          path: |
            eval/reports/checkov-ci.json
            eval/reports/trusted-baseline.json
            eval/reports/baseline-gate.json
          if-no-files-found: warn
          retention-days: 14
